{% extends "base.html" %}
{% block content %}

<section class="section">
    <h2>My Bookings</h2>
    <div class="table-wrapper">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>Room</th>
                    <th>Check-in</th>
                    <th>Check-out</th>
                    <th>Status</th>
                    <th>Payment</th>
                </tr>
            </thead>
            <tbody>
                {% for b in customer.bookings %}
                <tr>
                    <td>{{ b.room.name }}</td>
                    <td>{{ b.checkin }}</td>
                    <td>{{ b.checkout }}</td>
                    <td><span class="badge badge-{{ b.status|lower }}">{{ b.status }}</span></td>
                    <td><span class="badge badge-{{ b.payment_status|lower }}">{{ b.payment_status }}</span></td>
                </tr>
                {% else %}
                <tr><td colspan="5">You haven't made any bookings yet.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>

{% endblock %}
