{% extends "base.html" %}
{% block content %}

<section class="section">
    <h2>Our Rooms</h2>
    <div class="rooms-preview">
        {% for room in rooms %}
        <div class="room-card">
            <img src="{{ url_for('static', filename='images/' + room.image) }}" alt="{{ room.name }}">
            <div class="room-card-body">
                <h3>{{ room.name }}</h3>
                <p>{{ room.desc }}</p>
                <span class="room-price">${{ room.price }} / night</span>
                <a href="/booking?room_id={{ room.id }}" class="btn-primary" style="display:inline-block; margin-top:15px;">Book This Room</a>
            </div>
        </div>
        {% endfor %}
    </div>
</section>

{% endblock %}
