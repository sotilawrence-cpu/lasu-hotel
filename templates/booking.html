{% extends "base.html" %}
{% block content %}

<section class="section" style="max-width:600px; margin:0 auto;">
    <h2>Book Your Stay</h2>
    <form method="POST" action="/booking" class="booking-form">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="room_id">Select Room</label>
        <select id="room_id" name="room_id" required>
            {% for room in rooms %}
            <option value="{{ room.id }}" {% if selected_room and selected_room|int == room.id %}selected{% endif %}>
                {{ room.name }} — ${{ room.price }}/night
            </option>
            {% endfor %}
        </select>

        <label for="checkin">Check-in Date</label>
        <input type="date" id="checkin" name="checkin" required>

        <label for="checkout">Check-out Date</label>
        <input type="date" id="checkout" name="checkout" required>

        <button type="submit" class="btn-primary" style="margin-top:20px; cursor:pointer;">Confirm Booking</button>
    </form>
</section>

{% endblock %}
