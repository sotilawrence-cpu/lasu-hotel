{% extends "base.html" %}
{% block content %}

<section class="section" style="max-width:400px; margin:0 auto;">
    <h2>Login</h2>
    {% if error %}
    <p style="color:#721c24; background:#f8d7da; padding:10px; border-radius:8px;">{{ error }}</p>
    {% endif %}
    <form method="POST" action="/login" class="booking-form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="btn-primary" style="margin-top:20px; cursor:pointer;">Log In</button>
    </form>
    <p style="margin-top:15px;">New here? <a href="/signup">Create an account</a></p>
</section>

{% endblock %}
